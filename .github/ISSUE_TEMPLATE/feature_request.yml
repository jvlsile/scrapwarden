name: Feature request
description: Suggest an idea for Scrapwarden
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do on your server and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Plugins, other tools or workarounds you use now.
