name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - name: Syntax check
        shell: bash
        run: for f in server.js lib/*.js public/app.js tools/*.js; do node --check "$f"; done
      - name: Translations complete
        run: node tools/check-i18n.js
      - name: Panel starts
        shell: bash
        env:
          PORT: 8090
          SCRAPWARDEN_NO_UPDATE_CHECK: 1
        run: |
          node server.js > panel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/api/setup; then echo; exit 0; fi
            sleep 1
          done
          cat panel.log
          exit 1
